name: Backend and Frontend Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BACKEND_IMAGE_NAME: jrodolfo/job-portal-backend
      FRONTEND_IMAGE_NAME: jrodolfo/job-portal-frontend
      IMAGE_TAG: ${{ github.sha }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Build Backend JAR
      run: mvn -f job-portal-backend/pom.xml clean package -DskipTests

    - name: Log in to Docker Hub
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build Backend Docker Image
      run: |
        docker build -t $BACKEND_IMAGE_NAME:$IMAGE_TAG -t $BACKEND_IMAGE_NAME:latest job-portal-backend

    - name: Build Frontend Docker Image
      run: |
        docker build -t $FRONTEND_IMAGE_NAME:$IMAGE_TAG -t $FRONTEND_IMAGE_NAME:latest job-portal-frontend

    - name: Push Backend Docker Image
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        docker push $BACKEND_IMAGE_NAME:$IMAGE_TAG
        docker push $BACKEND_IMAGE_NAME:latest

    - name: Push Frontend Docker Image
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        docker push $FRONTEND_IMAGE_NAME:$IMAGE_TAG
        docker push $FRONTEND_IMAGE_NAME:latest
